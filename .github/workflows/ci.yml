name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLOWED_HOSTS: "test,testserver,localhost,127.0.0.1"

jobs:
  test:
    runs-on: windows-latest
    env:
      DEV_OPEN_API: "1"
      SECURITY_RATE_LIMIT_REQUESTS: "0"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~\AppData\Local\pip\Cache
        key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: pip-${{ runner.os }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-asyncio

    - name: Install frontend dependencies
      run: npm ci

    - name: Run Jest
      run: npm test -- --runInBand

    - name: Run tests with coverage
      run: |
        python -m pytest tests/unit tests/integration -v --cov=api --cov=services --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30


  lint:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~\AppData\Local\pip\Cache
        key: pip-lint-${{ runner.os }}
        restore-keys: pip-lint-${{ runner.os }}

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Type check public security boundary with mypy
      run: |
        mypy api/auth_security.py api/auth_router.py api/deps.py api/middleware_setup.py api/static_files_setup.py config/users.py --ignore-missing-imports --explicit-package-bases --follow-imports=skip

    - name: Validate OpenAPI
      run: |
        python -c "from api.main import app; import json; json.dumps(app.openapi())"
        python scripts/security/check_openapi_english.py

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install security scanners
      run: python -m pip install bandit pip-audit

    - name: Scan Python code
      run: bandit -r api services connectors -ll -x tests

    - name: Audit Python dependencies
      run: pip-audit -r requirements.txt

    - name: Reject unsafe direct model loads
      shell: bash
      run: |
        if grep -R -nE '(pickle|joblib|torch)\.load\(' api services connectors \
          --include='*.py' --exclude='safe_loader.py'; then
          echo "Direct model deserialization is forbidden; use services.ml.safe_loader."
          exit 1
        fi
