services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: smartfolio-proxy
    restart: unless-stopped
    ports:
      # Router forwarding targets the server LAN address; do not publish the
      # proxy on all IPv4/IPv6 interfaces.
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:8081:80"
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:8443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-segalla.ddns.net}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    networks:
      - smartfolio
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smartfolio:
    external: true
    name: smartfolio-network

volumes:
  caddy_data:
  caddy_config:
